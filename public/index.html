<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07071a">
  <meta name="description" content="Rocket Racer: an 8-bit rocket race around planets and asteroids, through giant donut checkpoints.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rocket Racer">
  <title>Rocket Racer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <!-- world layer (zooms) under a HUD layer (constant size); the HUD layer takes the input -->
    <canvas id="screen" width="640" height="360" aria-hidden="true"></canvas>
    <canvas id="hud" width="640" height="360" aria-label="Rocket Racer game" tabindex="0"></canvas>
    <div id="crt" aria-hidden="true"></div>
  </div>

  <!-- Pilot name for the online leaderboard: a real text field so phones show a keyboard.
       Opened from an invite link, it also says which room the player is about to join. -->
  <form id="namebox" hidden autocomplete="off">
    <label for="pilot" id="nametitle">PILOT NAME</label>
    <input id="pilot" name="pilot" type="text" maxlength="10" inputmode="text" autocapitalize="characters"
           autocorrect="off" spellcheck="false" enterkeyhint="done">
    <p id="namehelp">Shown on the world leaderboard. Letters and numbers, up to 10.</p>
    <div class="row">
      <button type="submit" id="nameok">OK</button>
      <button type="button" id="namecancel">CANCEL</button>
    </div>
  </form>

  <!-- A friend's room code, for online play. -->
  <form id="codebox" class="box" hidden autocomplete="off">
    <label for="roomcode">ROOM CODE</label>
    <input id="roomcode" name="roomcode" type="text" maxlength="4" inputmode="text" autocapitalize="characters"
           autocorrect="off" spellcheck="false" enterkeyhint="go">
    <p>The four letters on your friend's screen.</p>
    <div class="row">
      <button type="submit">JOIN</button>
      <button type="button" id="codecancel">CANCEL</button>
    </div>
  </form>

  <!-- An invite link to a private room, to copy or share (the room's host can have it lend a maxed-out rocket). -->
  <form id="linkbox" class="box" hidden autocomplete="off">
    <label for="invitelink" id="linktitle">INVITE LINK</label>
    <textarea id="invitelink" readonly rows="3" spellcheck="false"></textarea>
    <label id="lendrow" class="check"><input type="checkbox" id="lend"> LEND THEM A MAXED-OUT PHOENIX</label>
    <p id="linkhelp"></p>
    <div class="row">
      <button type="button" id="linkcopy">COPY</button>
      <button type="button" id="linkshare" hidden>SHARE</button>
      <button type="button" id="linkdone">DONE</button>
    </div>
  </form>

  <div id="probe" aria-hidden="true"></div>
  <noscript>Rocket Racer needs JavaScript to run.</noscript>

  <script src="src/core.js"></script>
  <script src="src/art.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/net.js"></script>
  <script src="src/proto.js"></script>
  <script src="src/records.js"></script>
  <script src="src/tracks.js"></script>
  <script src="src/game.js"></script>
  <script src="src/mp.js"></script>
  <script src="src/render.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
