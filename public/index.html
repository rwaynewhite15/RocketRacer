<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07071a">
  <meta name="description" content="Rocket Racer: an 8-bit rocket race around planets and asteroids, through giant donut checkpoints.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rocket Racer">
  <title>Rocket Racer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <!-- world layer (zooms) under a HUD layer (constant size); the HUD layer takes the input -->
    <canvas id="screen" width="640" height="360" aria-hidden="true"></canvas>
    <canvas id="hud" width="640" height="360" aria-label="Rocket Racer game"></canvas>
    <div id="crt" aria-hidden="true"></div>
  </div>

  <!-- Pilot name for the online leaderboard: a real text field so phones show a keyboard. -->
  <form id="namebox" hidden autocomplete="off">
    <label for="pilot">PILOT NAME</label>
    <input id="pilot" name="pilot" type="text" maxlength="10" inputmode="text" autocapitalize="characters"
           autocorrect="off" spellcheck="false" enterkeyhint="done">
    <p>Shown on the world leaderboard. Letters and numbers, up to 10.</p>
    <div class="row">
      <button type="submit">OK</button>
      <button type="button" id="namecancel">CANCEL</button>
    </div>
  </form>

  <div id="probe" aria-hidden="true"></div>
  <noscript>Rocket Racer needs JavaScript to run.</noscript>

  <script src="src/core.js"></script>
  <script src="src/art.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/net.js"></script>
  <script src="src/tracks.js"></script>
  <script src="src/game.js"></script>
  <script src="src/render.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
